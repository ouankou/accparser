name: accparser CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-llvm:
    strategy:
      matrix:
        os: [ubuntu-26.04]
        llvm: [21, 22]

    runs-on: ${{ matrix.os }}
    env:
      CC: /usr/bin/clang-${{ matrix.llvm }}
      CXX: /usr/bin/clang++-${{ matrix.llvm }}

    steps:
    - uses: actions/checkout@v7
    # NOTE: Ubuntu 26.04 ships antlr4 v4.9 but antlr4-cpp-runtime v4.10, which are API-incompatible; manually install the matching antlr4 v4.10.
    - uses: StoneMoe/setup-antlr4@v4.10.1

    - name: Add LLVM repository
      run: |
        sudo apt-get update
        sudo apt-get install -y ca-certificates gnupg wget
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor --yes -o /usr/share/keyrings/llvm-snapshot.gpg
        echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg] http://apt.llvm.org/resolute/ llvm-toolchain-resolute-${{ matrix.llvm }} main" | sudo tee /etc/apt/sources.list.d/llvm-toolchain-resolute-${{ matrix.llvm }}.list

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libantlr4-runtime-dev \
          build-essential \
          default-jre-headless \
          clang-${{ matrix.llvm }} \
          cmake

    - name: Build
      run: |
        cd $GITHUB_WORKSPACE/
        cmake -E rm -rf build
        cmake -S . -B build ${CMAKE_OPTIONS:-} -DCMAKE_CXX_FLAGS="${CXX_FLAGS:-}"
        cmake --build build -- -j$(nproc)

    - name: Run built-in tests
      run: |
        cd $GITHUB_WORKSPACE/build
        ctest -E "^openacc_vv_" --output-on-failure

    - name: Run OpenACC VV tests
      run: |
        cd $GITHUB_WORKSPACE/build
        ctest -R "^openacc_vv_" --output-on-failure

  build-gnu:
    strategy:
      matrix:
        os: [ubuntu-26.04]
        gnu: [13, 14, 15, 16]

    runs-on: ${{ matrix.os }}
    env:
      CC: /usr/bin/gcc-${{ matrix.gnu }}
      CXX: /usr/bin/g++-${{ matrix.gnu }}

    steps:
    - uses: actions/checkout@v7
    # NOTE: Ubuntu 26.04 ships antlr4 v4.9 but antlr4-cpp-runtime v4.10, which are API-incompatible; manually install the matching antlr4 v4.10.
    - uses: StoneMoe/setup-antlr4@v4.10.1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libantlr4-runtime-dev \
          build-essential \
          default-jre-headless \
          cmake \
          gcc-${{ matrix.gnu }} \
          g++-${{ matrix.gnu }}

    - name: Build
      run: |
        cd $GITHUB_WORKSPACE/
        cmake -E rm -rf build
        cmake -S . -B build ${CMAKE_OPTIONS:-} -DCMAKE_CXX_FLAGS="${CXX_FLAGS:-}"
        cmake --build build -- -j$(nproc)

    - name: Run built-in tests
      run: |
        cd $GITHUB_WORKSPACE/build
        ctest -E "^openacc_vv_" --output-on-failure

    - name: Run OpenACC VV tests
      run: |
        cd $GITHUB_WORKSPACE/build
        ctest -R "^openacc_vv_" --output-on-failure
